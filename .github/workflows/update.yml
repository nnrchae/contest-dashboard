name: Auto Update Contests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Check files and Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Current directory files:"
          ls -la
          
          # 만약 Design.py가 없으면 에러를 내지 말고 현재 폴더 구조 확인
          if [ -f "Design.py" ]; then
            python3 Design.py
          else
            echo "Design.py not found in root, searching..."
            find . -name "Design.py" -exec python3 {} \;
          fi

      - name: Deploy index.html to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false